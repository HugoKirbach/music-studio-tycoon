# Compile automatiquement l'application Windows (.exe) et Android (.apk) à chaque envoi sur la branche main,
# puis publie les fichiers dans l'onglet « Releases » du dépôt.
name: Compiler les applications

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Installer les outils
        run: npm install --no-audit --no-fund
      - name: Fabriquer l'installateur et la version portable
        run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MusicStudioTycoon-Windows
          path: release/*.exe
          if-no-files-found: error

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Installer les outils
        run: npm install --no-audit --no-fund
      - name: Vérifier le SDK Android du runner
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"
      - name: Créer le projet Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MusicStudioTycoon.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MusicStudioTycoon-Android
          path: MusicStudioTycoon.apk
          if-no-files-found: error

  release:
    name: Publier
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Créer la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Music Studio Tycoon 1.0.${{ github.run_number }}
          body: |
            - **Windows** : `MusicStudioTycoon-Installation-*.exe` (installe le jeu) ou `MusicStudioTycoon-Portable-*.exe` (se lance directement, sans installation).
            - **Android** : `MusicStudioTycoon.apk` (autorise l'installation d'applications inconnues pour ton navigateur ou ton gestionnaire de fichiers).
          files: out/*
          make_latest: true
